services:
  test_task:
    image: papaloopalous/effective-mobile-test:latest
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./configs:/app/configs
    ports:
      - "${MAIN_PORT}:${MAIN_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${MAIN_PORT}/health"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p 5432"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s

volumes:
  pgdata: