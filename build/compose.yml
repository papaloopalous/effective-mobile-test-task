services:
  test_task:
    image: papaloopalous/effective-mobile-test:latest
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./configs:/app/configs
    ports:
      - "${MAIN_PORT}:${MAIN_PORT}"

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    volumes:
      - pgdata:/var/lib/postgresql/data
      - .:/docker-entrypoint-initdb.d

volumes:
  pgdata: